name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy to VPS"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          printf '%s\n' \
            "Host my-vps" \
            "  HostName $SSH_IP" \
            "  User $SSH_USER" \
            "  IdentityFile ~/.ssh/deploy-key.pem" \
            "  StrictHostKeyChecking no" \
            >> ~/.ssh/config
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}

      - name: Deploy Site
        run: ssh my-vps '/root/mlh-portfolio/redeploy-site.sh'

      - name: Print Container Status
        run: ssh my-vps 'cd /root/mlh-portfolio && docker compose ps'

      - name: Deployment Test
        run: ssh my-vps 'cd /root/mlh-portfolio && bash ./curl-test.sh http://localhost:5001'

      - name: Notify Discord on Success
        if: success()
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=🚀 Deployment Successful"

      - name: Notify Discord on Failure
        if: failure()
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=❌ Deployment Failed"