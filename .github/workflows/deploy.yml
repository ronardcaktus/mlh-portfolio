name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy to VPS"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          printf '%s\n' \
            "Host my-vps" \
            "  HostName $SSH_IP" \
            "  User $SSH_USER" \
            "  IdentityFile ~/.ssh/deploy-key.pem" \
            "  StrictHostKeyChecking no" \
            >> ~/.ssh/config
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}

      - name: Deploy Site
        run: ssh my-vps '/root/mlh-portfolio/redeploy-site.sh'

      - name: Print Container Status
        run: ssh my-vps 'cd /root/mlh-portfolio && docker compose ps'

      - name: Deployment Test
        run: |
          ssh my-vps '
            set -e
            cd /root/mlh-portfolio

            echo "1) Checking container status"
            docker compose -f docker-compose.prod.yml ps

            echo "2) Checking site reachability"
            curl -fsS --retry 10 --retry-delay 3 --retry-connrefused https://rmoon.duckdns.org/ > /dev/null

            echo "3) Checking HTTP status code"
            test "$(curl -sS -o /dev/null -w "%{http_code}" https://rmoon.duckdns.org/)" = "200"
          '

      - name: Notify Discord on Success
        if: success()
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=🚀 Deployment Successful"

      - name: Notify Discord on Failure
        if: failure()
        run: curl -s -X POST "${{ secrets.DISCORD_WEBHOOK }}" -d "content=❌ Deployment Failed"